[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mask-path-jepa"
version = "0.1.0"
description = "Mask-path InfoNCE without EMA in a global image-level JEPA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.scripts]
mask-path-jepa-train = "train:main"

[tool.setuptools.packages.find]
include = ["mask_path_jepa*"]
