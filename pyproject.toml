[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tripletjepa"
version = "0.1.0"
description = "Margin-regularized JEPA for low-resource SSL experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.scripts]
tripletjepa-train = "train:main"

[tool.setuptools.packages.find]
include = ["tripletjepa*"]
